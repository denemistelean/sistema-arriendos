services:
  - type: web
    name: sistema-arriendos
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn sistema_arriendos.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema_arriendos_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: sistema_arriendos_db
    databaseName: sistema_arriendos
    user: sistema_user
