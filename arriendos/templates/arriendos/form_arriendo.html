{% extends 'arriendos/base.html' %}
{% block title %}Nuevo Arriendo{% endblock %}

{% block content %}
<h2>Registrar Nuevo Arriendo</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'lista_arriendos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
