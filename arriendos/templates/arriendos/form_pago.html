{% extends 'arriendos/base.html' %}
{% block title %}Registrar Pago{% endblock %}

{% block content %}
<h2>Registrar Pago para: {{ arriendo.nombre }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'detalle_arriendo' arriendo.id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
